paths:
  documents_dir: "./documents"
  data_dir: "./data"
  models_cache_dir: "./models_cache"

documents:
  supported_formats:
    # Upstream defaults
    - .md        # Documentation, READMEs, playbooks, ADRs
    - .txt       # Plain text notes
    - .pdf       # Technical papers, specs
    - .py        # Python scripts
    - .c         # C source
    - .h         # C/C++ headers
    - .cpp       # C++ source
    - .js        # JavaScript
    - .jsx       # React JSX
    - .ts        # TypeScript
    - .tsx       # React TSX
    - .json      # API schemas, configs, realm files
    - .xml       # XML documents
    - .docx      # Word documents
    - .xlsx      # Excel spreadsheets
    - .pptx      # PowerPoint presentations
    - .csv       # CSV data
    - .ipynb     # Jupyter notebooks
    # Xata-repo additions
    - .go        # Go source (maki services, kubectl plugin, tools)
    - .yaml      # K8s manifests, Helm charts, Pulumi configs
    - .yml       # GitHub Actions, CI configs
    - .hujson    # Tailscale policy (Human JSON)
    - .cue       # CUE policy definitions
    - .proto     # Protocol Buffers (gRPC definitions)
    - .rego      # OPA policies
    - .kt        # Kotlin (Keycloak plugins)
    - .sql       # SQL migrations
    - .sh        # Shell scripts
    - .jq        # JQ filters
    - .rs        # Rust source (xatastor crates)
    - .toml      # TOML configs (Cargo.toml, etc.)
    - "Dockerfile"
    - "Makefile"
    - "Tiltfile"

  exclude_patterns:
    - ".git"
    - "node_modules"
    - "__pycache__"
    - ".venv"
    - "dist"
    - "build"
    - ".next"
    - "gen"
    - "protomocks"
    - ".sops"
    - ".DS_Store"
    - "*.sum"
    - "*.lock"
    - "*.map"
    - "*.rev"
    - "*.pack"
    - "*.idx"

  chunking:
    chunk_size: 1200
    chunk_overlap: 250

models:
  embedding:
    model: "BAAI/bge-small-en-v1.5"
    dimensions: 384
    gpu: false

  reranker:
    enabled: true
    model: "Xenova/ms-marco-MiniLM-L-6-v2"
    top_k_multiplier: 3

search:
  default_results: 5
  max_results: 20
  collection_name: "knowledge_base"

